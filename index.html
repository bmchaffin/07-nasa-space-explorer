<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>NASA Space Explorer</title>
  <link rel="manifest" href="manifest.json" />
  <meta name="theme-color" content="#0b3d91" />
  <link href="style.css" rel="stylesheet" type="text/css" />
</head>
<body>
  <div class="container">
    <header class="site-header">
      <img src="img/nasa-worm-logo.png" alt="NASA Logo" class="logo" />
      <h1>Space Explorer</h1>
    </header>

    <div class="filters">
      <input type="date" id="startDate" />
      <input type="date" id="endDate" />
      <button id="getImagesButton" type="button">Get Space Images</button>
    </div>

    <section class="app-controls" aria-label="App controls">
      <p id="offlineStatus" class="connection-status" role="status" hidden>You are offline. Showing saved space photos when available.</p>
      <div id="installPrompt" class="install-prompt" hidden>
        <p>Install Space Explorer for quick access and offline support.</p>
        <button id="installButton" type="button">Install App</button>
        <button id="dismissInstallButton" class="secondary-button" type="button">Not now</button>
      </div>
      <button id="notificationButton" class="secondary-button" type="button">Enable Daily Notifications</button>
    </section>

    <section class="space-fact" aria-live="polite">
      <p class="fact-label">Did You Know?</p>
      <p id="spaceFact"></p>
    </section>

    <div id="gallery" class="gallery">
      <div class="placeholder">
        <div class="placeholder-icon">🔭</div>
        <p>Select a date range and click "Get Space Images" to explore the cosmos!</p>
      </div>
    </div>
  </div>

  <div id="imageModal" class="modal" role="dialog" aria-modal="true" aria-labelledby="modalTitle" hidden>
    <div class="modal-content">
      <button id="closeModalButton" class="close-modal" type="button" aria-label="Close image details">&times;</button>
      <img id="modalImage" src="" alt="" />
      <div class="modal-details">
        <p id="modalDate" class="modal-date"></p>
        <h2 id="modalTitle"></h2>
        <p id="modalExplanation"></p>
      </div>
    </div>
  </div>

  <script src="js/dateRange.js"></script>
  <script src="js/script.js"></script>
  <script>
    if ('serviceWorker' in navigator) {
      window.addEventListener('load', () => navigator.serviceWorker.register('sw.js'));
    }
  </script>
</body>
</html>
